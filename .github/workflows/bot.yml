name: Бот-калькулятор долгов

on:
  schedule:
    # Время в UTC. Каждые 30 минут бот забирает накопившиеся сообщения Telegram.
    # Точность запуска GitHub не гарантирует: задержка 5–30 минут — норма.
    - cron: "*/1 * * * *"
  workflow_dispatch: # кнопка «Run workflow» — обработать сообщения прямо сейчас, с телефона

concurrency:
  # Два одновременных запуска недопустимы: параллельный getUpdates даёт ошибку HTTP 409
  group: debt-bot
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY || 'BYN' }}
      ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
      LOG_LEVEL: INFO
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: "Диагностика: настройки и сервисы"
        if: always()
        continue-on-error: true
        run: python bot.py --check

      - name: Обработать накопившиеся сообщения
        run: python bot.py --once
