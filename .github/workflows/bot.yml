name: Диагностика настроек и сервисов (ручной запуск)

# ВАЖНО: основной режим — вебхук на хостинге (PythonAnywhere/Vercel) или постоянный
# процесс (long polling), поэтому расписание (cron) отключено намеренно: два
# одновременных «слушателя» Telegram дают HTTP 409 Conflict и «воруют» друг у друга
# сообщения. Оставлен только ручной запуск — проверить секреты и доступность сервисов.
#
# Хотите вернуть режим GitHub Actions (ответы с задержкой, зато без хостинга)?
# Добавьте обратно расписание и шаг обработки (и выключите вебхук: python bot.py --delete-webhook):
#   on:
#     schedule:
#       - cron: "*/30 * * * *"     # минимум у GitHub — раз в 5 минут
#     workflow_dispatch:
#   ...
#       - name: Обработать накопившиеся сообщения
#         run: python bot.py --once

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY || 'BYN' }}
      ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
      LOG_LEVEL: INFO
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: "Диагностика: настройки и сервисы"
        run: python bot.py --check

      - name: Тесты
        run: python -m unittest tests.test_pipeline

